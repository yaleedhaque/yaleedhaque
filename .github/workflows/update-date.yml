name: Update Last Updated Date

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-date:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update the Last updated date
        run: |
          today=$(date -u +%Y-%m-%d)
          sed -i "s|<!--DATE-->.*<!--/DATE-->|<!--DATE-->_Last updated: ${today}_<!--/DATE-->|" README.md

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "yaleedhaque[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update last updated date"
            git push
          else
            echo "No change to README date; nothing to commit."
          fi
