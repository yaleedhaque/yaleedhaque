name: Update Last Updated Date

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-date:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update the Last updated date
        run: |
          today=$(date -u +%Y-%m-%d)
          # Rewrite only the date inside the marker so surrounding wording survives.
          if grep -q '<!--DATE-->' README.md; then
            sed -i "s|\(<!--DATE-->.*\)[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\(.*<!--/DATE-->\)|\1${today}\2|" README.md
          else
            printf '\n<!--DATE-->_Md. Yaleed Haque · Dhaka, Bangladesh · Updated %s_<!--/DATE-->\n' "$today" >> README.md
          fi

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "yaleedhaque[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update last updated date"
            git push
          else
            echo "No change to README date; nothing to commit."
          fi
