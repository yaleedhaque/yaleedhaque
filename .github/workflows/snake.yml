name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: yaleedhaque
          outputs: |
            dist/github-snake.svg?color_snake=orange&color_dots=%230969da,%230969da,%230969da,%230969da,%230969da,%231f6feb,%231f6feb
            dist/github-snake-dark.svg?color_snake=orange&color_dots=%230d1117,%230d1117,%230d1117,%230d1117,%230d1117,%231f6feb,%231f6feb

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}